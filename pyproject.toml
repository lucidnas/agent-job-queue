[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-job-queue"
dynamic = ["version"]
description = "A machine-wide job queue for AI coding agents: heavy work takes turns so your machine never gets buried."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "lucidnas"}]
keywords = ["ai-agents", "claude-code", "codex", "queue", "cli", "render", "local-first"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/lucidnas/agent-job-queue"

[project.scripts]
aq = "agent_job_queue.cli:main"
agent-job-queue = "agent_job_queue.cli:main"

[tool.setuptools]
packages = ["agent_job_queue"]

[tool.setuptools.package-data]
agent_job_queue = ["hooks/*"]

[tool.setuptools.dynamic]
version = {attr = "agent_job_queue.__version__"}
